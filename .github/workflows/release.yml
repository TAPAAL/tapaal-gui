name: Build Release

# Builds the TAPAAL release packages, each uploaded as its own artifact:
#   tapaal-<V>-linux64.zip, tapaal-<V>-win64.zip,
#   tapaal-<V>-mac-intel64.dmg, tapaal-<V>-mac-arm64.dmg
#
# The engines (verifypn, verifydtapn, verifytapn) are NOT rebuilt here. The binaries
# are taken from the latest successful run on the main branch of each engine's build
# workflows, so run those workflows first if you need fresh engine builds.
#
# Each packaging job is self-contained (fetches its own engines and builds the GUI),
# so no intermediate artifacts are created - only the four release files.
#
# If the "publish" option is ticked (off by default) and all packages are built, the
# "publish" job replaces the rolling GitHub release "latest-build" with these files plus
# copies with fixed names, giving permanent links:
#   https://github.com/<owner>/<repo>/releases/download/latest-build/tapaal-linux64.zip
#   (also tapaal-win64.zip, tapaal-mac-intel64.dmg, tapaal-mac-arm64.dmg)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to use VERSION from src/main/java/net/tapaal/TAPAAL.java on the main branch)"
        required: false
        default: ""
      publish:
        description: "Publish to the latest-build release (fixed download links)"
        type: boolean
        default: false

env:
  ENGINE_OWNER: TAPAAL

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check out TAPAAL.java from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: src/main/java/net/tapaal/TAPAAL.java
          sparse-checkout-cone-mode: false

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SRC=src/main/java/net/tapaal/TAPAAL.java
          MAIN_VERSION=$(sed -nE 's/.*public static final String VERSION = "([^"]*)";.*/\1/p' "$SRC")
          echo "VERSION on main in $SRC: '$MAIN_VERSION'"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$MAIN_VERSION"
            if [ -z "$VERSION" ] || [ "$VERSION" = "DEV" ]; then
              echo "::error::VERSION in $SRC on main is '$VERSION'. Set a release version there or enter one when running the workflow."
              exit 1
            fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building TAPAAL release **$VERSION**" >> "$GITHUB_STEP_SUMMARY"

  package-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Optional secret ENGINES_TOKEN (actions:read on the engine repos) if the
      # default token cannot read the engine artifacts.
      GH_TOKEN: ${{ secrets.ENGINES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch engines
        run: tools/release/fetch-engines.sh linux64 engines

      - name: Build GUI
        run: tools/release/build-gui.sh "$VERSION" gui-lib

      - name: Package
        run: |
          set -euo pipefail
          D="tapaal-$VERSION-linux64"
          mkdir -p "$D/bin" "$D/lib" out
          cp gui-lib/*.jar "$D/lib/"
          cp engines/* "$D/bin/"
          chmod +x "$D"/bin/*
          cp tools/distribution-info/linux/tapaal "$D/tapaal"
          chmod +x "$D/tapaal"
          sed -E "1s/^TAPAAL [^ ]+ is licensed/TAPAAL $VERSION is licensed/" tools/distribution-info/LICENSE.txt > "$D/LICENSE.txt"
          sed -e "1s/.*/TAPAAL v$VERSION/" -e "2s/.*/$(LC_ALL=C date +'%B %Y')/" \
            tools/distribution-info/linux/README.txt > "$D/README.txt"
          zip -r -X "out/$D.zip" "$D"
          unzip -l "out/$D.zip"

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: out/tapaal-${{ env.VERSION }}-linux64.zip
          archive: false
          if-no-files-found: error

  package-windows:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.ENGINES_TOKEN || github.token }}
      LAUNCH4J_VERSION: "3.50"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch engines
        run: tools/release/fetch-engines.sh win64 engines

      - name: Build GUI
        run: tools/release/build-gui.sh "$VERSION" gui-lib

      - name: Build tapaal.exe with launch4j
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          curl -fsSL -o launch4j.tgz \
            "https://downloads.sourceforge.net/project/launch4j/launch4j-3/${LAUNCH4J_VERSION}/launch4j-${LAUNCH4J_VERSION}-linux-x64.tgz"
          tar xzf launch4j.tgz
          mkdir -p l4j
          convert src/main/resources/Images/tapaal-icon.png -define icon:auto-resize=256,128,64,48,32,16 l4j/tapaal.ico
          # Windows version info needs the form x.x.x.x
          V4=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,3}')
          while [ "$(echo "$V4" | tr -cd '.' | wc -c)" -lt 3 ]; do V4="$V4.0"; done
          sed -e "s/@VERSION4@/$V4/g" -e "s/@YEAR@/$(date +%Y)/g" tools/launch4j-template.xml > l4j/tapaal.xml
          java -jar launch4j/launch4j.jar "$PWD/l4j/tapaal.xml"
          ls -l l4j/tapaal.exe

      - name: Package
        run: |
          set -euo pipefail
          D="tapaal-$VERSION-win64"
          mkdir -p "$D/bin" "$D/lib" out
          cp gui-lib/*.jar "$D/lib/"
          cp engines/* "$D/bin/"
          cp l4j/tapaal.exe "$D/"
          sed -E "1s/^TAPAAL [^ ]+ is licensed/TAPAAL $VERSION is licensed/" tools/distribution-info/LICENSE.txt > "$D/LICENSE.txt"
          sed -e "1s/.*/TAPAAL v$VERSION/" -e "2s/.*/$(LC_ALL=C date +'%B %Y')/" \
            tools/distribution-info/win/README.txt > "$D/README.txt"
          zip -r -X "out/$D.zip" "$D"
          unzip -l "out/$D.zip"

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: out/tapaal-${{ env.VERSION }}-win64.zip
          archive: false
          if-no-files-found: error

  package-mac:
    needs: prepare
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: intel64
            engines: osx64
          - arch: arm64
            engines: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.ENGINES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch engines
        run: tools/release/fetch-engines.sh ${{ matrix.engines }} engines

      - name: Build GUI
        run: tools/release/build-gui.sh "$VERSION" gui-lib

      - name: Build Tapaal.app
        run: |
          set -euo pipefail
          APP=stage/Tapaal.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/lib" "$APP/Contents/Resources/bin"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@YEAR@/$(date +%Y)/g" \
            tools/distribution-info/mac/Info.plist.template > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          cp tools/distribution-info/mac/app-launcher.sh "$APP/Contents/MacOS/tapaal"
          chmod +x "$APP/Contents/MacOS/tapaal"
          cp gui-lib/*.jar "$APP/Contents/Resources/lib/"
          cp engines/* "$APP/Contents/Resources/bin/"
          chmod +x "$APP"/Contents/Resources/bin/*

          # Icon
          ICONSET=AppIcon.iconset
          mkdir -p "$ICONSET"
          SRC=src/main/resources/Images/tapaal-icon.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); [ $d -gt 512 ] && d=512
            sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          # Ad-hoc signature (no notarization)
          codesign --force --deep -s - "$APP"

          sed -E "1s/^TAPAAL [^ ]+ is licensed/TAPAAL $VERSION is licensed/" tools/distribution-info/LICENSE.txt > stage/LICENSE.txt
          sed -e "1s/.*/TAPAAL v$VERSION/" -e "2s/.*/$(LC_ALL=C date +'%B %Y')/" \
            tools/distribution-info/mac/README.txt > stage/README.txt
          ln -s /Applications stage/Applications
          ls -lR stage | head -60

      - name: Create DMG
        run: |
          set -euo pipefail
          NAME="tapaal-$VERSION-mac-${{ matrix.arch }}"
          mkdir -p out
          hdiutil create -volname "$NAME" -srcfolder stage -fs HFS+ -format UDZO -ov "out/$NAME.dmg"
          ls -l out

      - uses: actions/upload-artifact@v7.0.1
        with:
          path: out/tapaal-${{ env.VERSION }}-mac-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error

  publish:
    needs: [prepare, package-linux, package-windows, package-mac]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and tag
      actions: read     # read this run's artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: latest-build
    steps:
      - name: Download release files of this run
        run: |
          set -euo pipefail
          mkdir -p dist
          artifacts=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
          for os in linux64 win64 mac-intel64 mac-arm64; do
            case "$os" in mac-*) ext=dmg ;; *) ext=zip ;; esac
            f="tapaal-$VERSION-$os.$ext"
            id=$(jq -r --arg n "$f" '.artifacts[] | select(.name == $n) | .id' <<< "$artifacts")
            if [ -z "$id" ]; then
              echo "::error::Artifact $f not found in this run"
              exit 1
            fi
            # Artifacts were uploaded with archive: false, so this is the file itself
            gh api "repos/$GH_REPO/actions/artifacts/$id/zip" > "dist/$f"

            # Sanity checks: do not publish a wrapped or broken file
            if [ "$ext" = zip ]; then
              unzip -l "dist/$f" | grep -q " tapaal-$VERSION-$os/" \
                || { echo "::error::$f does not contain tapaal-$VERSION-$os/"; exit 1; }
            else
              [ "$(head -c 2 "dist/$f")" != "PK" ] \
                || { echo "::error::$f is a zip, not a dmg"; exit 1; }
              [ "$(tail -c 512 "dist/$f" | head -c 4)" = "koly" ] \
                || { echo "::error::$f is not a valid dmg"; exit 1; }
            fi

            # Copy with a version-free name for permanent download links
            cp "dist/$f" "dist/tapaal-$os.$ext"
          done
          ls -l dist

      - name: Replace the rolling release
        run: |
          set -euo pipefail
          base="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$TAG"
          {
            echo "Latest build of TAPAAL **$VERSION**, built $(date -u +'%Y-%m-%d %H:%M UTC') from commit $GITHUB_SHA."
            echo
            echo "Engine builds used are listed in the [workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "Permanent download links (always point to the latest build):"
            for f in tapaal-linux64.zip tapaal-win64.zip tapaal-mac-intel64.dmg tapaal-mac-arm64.dmg; do
              echo "- $base/$f"
            done
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          # Remove a leftover tag (without release) so the new tag points to this commit
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG"
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --latest=false \
            --title "TAPAAL $VERSION (latest build)" --notes-file notes.md

          {
            echo "### Published to release \`$TAG\`"
            tail -n +5 notes.md
          } >> "$GITHUB_STEP_SUMMARY"
