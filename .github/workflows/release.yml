name: Build Release

# Builds the TAPAAL release packages:
#   tapaal-<V>-linux64.zip, tapaal-<V>-win64.zip,
#   tapaal-<V>-mac-intel64.dmg, tapaal-<V>-mac-arm64.dmg
#
# The engines (verifypn, verifydtapn, verifytapn) are NOT rebuilt here. The binaries
# are taken from the latest successful run on the main branch of each engine's build
# workflows, so run those workflows first if you need fresh engine builds.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to use TAPAAL_VERSION from the workflow file)"
        required: false
        default: ""

env:
  # Release version of tapaal-gui - update before running a new release
  TAPAAL_VERSION: "4.0.5"
  ENGINE_OWNER: TAPAAL

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$TAPAAL_VERSION}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building TAPAAL release **$VERSION**" >> "$GITHUB_STEP_SUMMARY"

  fetch-engines:
    runs-on: ubuntu-latest
    env:
      # An optional secret ENGINES_TOKEN (with actions:read on the engine repos) can be
      # provided if the default token cannot read the engine artifacts.
      GH_TOKEN: ${{ secrets.ENGINES_TOKEN || github.token }}
    steps:
      - name: Download latest engine binaries from main
        run: |
          set -euo pipefail
          declare -A WORKFLOW=( [linux64]=build-linux.yml [win64]=build-win.yml [osx64]=build-macos.yml [arm64]=build-macos-arm.yml )
          {
            echo "### Engine builds used"
            echo "| Engine | Platform | Run | Commit | Date |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for engine in verifypn verifydtapn verifytapn; do
            for platform in linux64 win64 osx64 arm64; do
              wf="${WORKFLOW[$platform]}"
              repo="$ENGINE_OWNER/$engine"
              run_json=$(gh run list -R "$repo" --workflow "$wf" --branch main --status success --limit 1 \
                         --json databaseId,headSha,createdAt,url)
              run_id=$(jq -r '.[0].databaseId // empty' <<< "$run_json")
              if [ -z "$run_id" ]; then
                echo "::error::No successful run of $wf on main in $repo"
                exit 1
              fi
              sha=$(jq -r '.[0].headSha' <<< "$run_json")
              date=$(jq -r '.[0].createdAt' <<< "$run_json")
              url=$(jq -r '.[0].url' <<< "$run_json")

              dl="dl/$engine-$platform"
              if ! gh run download "$run_id" -R "$repo" -n "$engine-$platform" -D "$dl"; then
                echo "::error::Could not download artifact $engine-$platform from $url (expired?). Re-run $wf in $repo."
                exit 1
              fi

              src=$(find "$dl" -type f | head -n 1)
              mkdir -p "engines-$platform"
              if [ "$platform" = win64 ]; then
                dst="engines-$platform/${engine}64.exe"
              else
                dst="engines-$platform/${engine}64"
              fi
              mv "$src" "$dst"
              chmod +x "$dst"
              echo "$engine $platform <- run $run_id ($sha)"
              echo "| $engine | $platform | [$run_id]($url) | \`${sha:0:10}\` | $date |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          ls -l engines-*

      - uses: actions/upload-artifact@v4
        with:
          name: engines-linux64
          path: engines-linux64
      - uses: actions/upload-artifact@v4
        with:
          name: engines-win64
          path: engines-win64
      - uses: actions/upload-artifact@v4
        with:
          name: engines-osx64
          path: engines-osx64
      - uses: actions/upload-artifact@v4
        with:
          name: engines-arm64
          path: engines-arm64

  build-gui:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          java-package: jdk

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set release version
        run: |
          sed -i 's/VERSION = "DEV";/VERSION = "'"$VERSION"'";/' src/main/java/net/tapaal/TAPAAL.java
          grep -q "VERSION = \"$VERSION\";" src/main/java/net/tapaal/TAPAAL.java || { echo "::error::Failed to set version"; exit 1; }

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew installDist -x test

      - name: Collect jars
        run: |
          mkdir -p gui/lib
          cp build/install/TAPAAL/lib/*.jar gui/lib/
          mv gui/lib/TAPAAL-*.jar gui/lib/tapaal.jar
          ls -l gui/lib

      - uses: actions/upload-artifact@v4
        with:
          name: gui-lib
          path: gui/lib

  package-zips:
    needs: [prepare, fetch-engines, build-gui]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LAUNCH4J_VERSION: "3.50"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gui-lib
          path: gui-lib
      - uses: actions/download-artifact@v4
        with:
          name: engines-linux64
          path: engines-linux64
      - uses: actions/download-artifact@v4
        with:
          name: engines-win64
          path: engines-win64

      - name: Set up JDK 17 (for launch4j)
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Package Linux
        run: |
          set -euo pipefail
          D="tapaal-$VERSION-linux64"
          mkdir -p "$D/bin" "$D/lib"
          cp gui-lib/*.jar "$D/lib/"
          cp engines-linux64/* "$D/bin/"
          chmod +x "$D"/bin/*
          cp tools/distribution-info/linux/tapaal "$D/tapaal"
          chmod +x "$D/tapaal"
          cp tools/distribution-info/LICENSE.txt "$D/"
          sed -e "1s/.*/TAPAAL v$VERSION/" -e "2s/.*/$(LC_ALL=C date +'%B %Y')/" \
            tools/distribution-info/linux/README.txt > "$D/README.txt"
          mkdir -p out
          zip -r -X "out/$D.zip" "$D"
          unzip -l "out/$D.zip"

      - name: Build tapaal.exe with launch4j
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          curl -fsSL -o launch4j.tgz \
            "https://downloads.sourceforge.net/project/launch4j/launch4j-3/${LAUNCH4J_VERSION}/launch4j-${LAUNCH4J_VERSION}-linux-x64.tgz"
          tar xzf launch4j.tgz
          mkdir -p l4j
          convert src/main/resources/Images/tapaal-icon.png -define icon:auto-resize=256,128,64,48,32,16 l4j/tapaal.ico
          # Windows version info needs the form x.x.x.x
          V4=$(echo "$VERSION" | grep -oE '^[0-9]+(\.[0-9]+){0,3}')
          while [ "$(echo "$V4" | tr -cd '.' | wc -c)" -lt 3 ]; do V4="$V4.0"; done
          sed -e "s/@VERSION4@/$V4/g" -e "s/@YEAR@/$(date +%Y)/g" tools/launch4j-template.xml > l4j/tapaal.xml
          java -jar launch4j/launch4j.jar "$PWD/l4j/tapaal.xml"
          ls -l l4j/tapaal.exe

      - name: Package Windows
        run: |
          set -euo pipefail
          D="tapaal-$VERSION-win64"
          mkdir -p "$D/bin" "$D/lib"
          cp gui-lib/*.jar "$D/lib/"
          cp engines-win64/* "$D/bin/"
          cp l4j/tapaal.exe "$D/"
          cp tools/distribution-info/LICENSE.txt "$D/"
          sed -e "1s/.*/TAPAAL v$VERSION/" -e "2s/.*/$(LC_ALL=C date +'%B %Y')/" \
            tools/distribution-info/win/README.txt > "$D/README.txt"
          zip -r -X "out/$D.zip" "$D"
          unzip -l "out/$D.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: tapaal-zips
          path: out/*.zip

  package-mac:
    needs: [prepare, fetch-engines, build-gui]
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: intel64
            engines: osx64
          - arch: arm64
            engines: arm64
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gui-lib
          path: gui-lib
      - uses: actions/download-artifact@v4
        with:
          name: engines-${{ matrix.engines }}
          path: engines

      - name: Build Tapaal.app
        run: |
          set -euo pipefail
          APP=stage/Tapaal.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/lib" "$APP/Contents/Resources/bin"
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@YEAR@/$(date +%Y)/g" \
            tools/distribution-info/mac/Info.plist.template > "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          cp tools/distribution-info/mac/app-launcher.sh "$APP/Contents/MacOS/tapaal"
          chmod +x "$APP/Contents/MacOS/tapaal"
          cp gui-lib/*.jar "$APP/Contents/Resources/lib/"
          cp engines/* "$APP/Contents/Resources/bin/"
          chmod +x "$APP"/Contents/Resources/bin/*

          # Icon
          ICONSET=AppIcon.iconset
          mkdir -p "$ICONSET"
          SRC=src/main/resources/Images/tapaal-icon.png
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); [ $d -gt 512 ] && d=512
            sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          # Ad-hoc signature (no notarization)
          codesign --force --deep -s - "$APP"

          cp tools/distribution-info/LICENSE.txt stage/
          sed -e "1s/.*/TAPAAL v$VERSION/" -e "2s/.*/$(LC_ALL=C date +'%B %Y')/" \
            tools/distribution-info/mac/README.txt > stage/README.txt
          ln -s /Applications stage/Applications
          ls -lR stage | head -60

      - name: Create DMG
        run: |
          set -euo pipefail
          NAME="tapaal-$VERSION-mac-${{ matrix.arch }}"
          mkdir -p out
          hdiutil create -volname "$NAME" -srcfolder stage -fs HFS+ -format UDZO -ov "out/$NAME.dmg"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: tapaal-dmg-${{ matrix.arch }}
          path: out/*.dmg

  collect:
    needs: [prepare, package-zips, package-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tapaal-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          ls -l release
          {
            echo "### Release files"
            for f in release/*; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tapaal-${{ needs.prepare.outputs.version }}-release
          path: release/*
