plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.20'
    id "org.javacc.javacc" version "4.0.3"
}

group 'net.tapaal'
version '4.0-SNAPSHOT'

var toolchainJavaVersion = 25
var targetBytecodeVersion = "17"
var targetKotlinVersion = "2.0"

java {
    sourceCompatibility = targetBytecodeVersion
    targetCompatibility = targetBytecodeVersion
    toolchain {
        languageVersion = JavaLanguageVersion.of(toolchainJavaVersion)
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = targetBytecodeVersion
        apiVersion = targetKotlinVersion
        languageVersion = targetKotlinVersion
    }
}

compileKotlin {
    dependsOn compileJavacc
}

application {
    mainClass = 'TAPAAL'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir compileJavacc.outputDirectory
        }
    }
}

jar {
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF'

    //Sets the main call for the Jar, you can double click to run the jar file
    manifest {
        attributes (
            'Main-Class': application.mainClass.get()
        )
    }
    //The following lines makes libs a part of the build jar file (standalone jar)
    //duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    //from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

dependencies {
    implementation 'commons-cli:commons-cli:1.5.0'
    implementation 'org.swinglabs.swingx:swingx-all:1.6.5-1'
    implementation 'net.java.dev.jna:jna:5.11.0'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3'
    implementation 'org.jfree:jfreechart:1.5.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
   // testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
   // testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

test {
    useJUnitPlatform {
        excludeTags 'gui'
    }
}

// Swing smoke tests are intentionally opt-in and are run under Xvfb in CI/local development.
tasks.register('guiTest', Test) {
    description = 'Runs GUI regression tests; use xvfb-run on headless machines.'
    group = 'verification'
    dependsOn testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'gui'
    }
    systemProperty 'java.awt.headless', 'false'
}

check {
    dependsOn tasks.named('guiTest')
}

run {
    systemProperties System.getProperties()
}
