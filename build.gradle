plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.20'
    id "org.javacc.javacc" version "4.0.3"
}

group 'net.tapaal'
version '4.0-SNAPSHOT'

var targetJavaVersion = "17"
var targetKotlinVersion = "2.0"

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = targetJavaVersion
        apiVersion = targetKotlinVersion
        languageVersion = targetKotlinVersion
    }
}

compileKotlin {
    dependsOn compileJavacc
}

application {
    mainClass = 'TAPAAL'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir compileJavacc.outputDirectory
        }
    }
}

jar {
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.MF'

    //Sets the main call for the Jar, you can double click to run the jar file
    manifest {
        attributes (
            'Main-Class': application.mainClass.get()
        )
    }
    //The following lines makes libs a part of the build jar file (standalone jar)
    //duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    //from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

dependencies {
    implementation 'commons-cli:commons-cli:1.5.0'
    implementation 'org.swinglabs.swingx:swingx-all:1.6.5-1'
    implementation 'net.java.dev.jna:jna:5.11.0'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.3'
    implementation 'org.jfree:jfreechart:1.5.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
   // testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
   // testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

test {
    useJUnitPlatform()
    // GUI scenarios share static application state, so they run in guiSmokeTest instead.
    exclude 'net/tapaal/gui/smoke/**'
}

tasks.register('guiSmokeTest', Test) {
    description = 'Runs the GUI scenarios in net.tapaal.gui.smoke on a display, one JVM per test class.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    // Every *Test class in the smoke package is a scenario; nothing else needs registering.
    // Helpers are left out so that forkEvery does not start a JVM for each of them.
    include 'net/tapaal/gui/smoke/**/*Test.class'
    // The application keeps its window and tabs in static state, so each class gets a fresh JVM.
    forkEvery = 1
    def artifacts = layout.buildDirectory.dir('reports/gui-smoke')
    outputs.dir(artifacts)
    outputs.upToDateWhen { false }
    doFirst {
        delete(artifacts)
    }
    systemProperty 'tapaal.smoke.artifacts', artifacts.get().asFile.absolutePath
    systemProperty 'java.util.prefs.userRoot', new File(temporaryDir, "preferences").absolutePath
    // A hung scenario fails instead of blocking the build; @Timeout on a test overrides this.
    systemProperty 'junit.jupiter.execution.timeout.testable.method.default', '60 s'
    // Keep the automatic version check offline during this workflow.
    systemProperty 'http.proxyHost', '127.0.0.1'
    systemProperty 'http.proxyPort', '1'
    testLogging.showStandardStreams = true
}

run {
    systemProperties System.getProperties()
}
